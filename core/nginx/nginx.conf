# DX-FSM Nginx Gateway (thay thế APISIX)
# Routing tương đương core/apisix/routes.yaml.
# Lý do: APISIX image bị Docker Hub proxy chặn. Nginx nằm trong library/*.

# Key: resolver 127.0.0.11 (Docker DNS) + proxy_pass với BIẾN
# để nginx re-resolve upstream mỗi request (không cache DNS lúc startup).

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # Docker internal DNS – cho phép re-resolve động
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── CORS headers helper ──────────────────────────────────────────────
    # Dùng bằng cách include trong từng location proxy
    map $request_method $cors_origin {
        default "http://localhost:3000";
        OPTIONS "";
    }

    # ─── Public server (port 80) ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # OPTIONS preflight – phải ở trước để không bị catch-all 404
        location = /_preflight {
            internal;
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }

        # OPTIONS request → preflight
        if ($request_method = OPTIONS) {
            rewrite ^ /_preflight last;
        }

        # Catch-all: non-API → 404 (đặt SAU các API routes để không chặn)
        location / {
            return 404 '{"detail":"Not found"}';
            default_type application/json;
        }

        # ─── Health check ──────────────────────────────────────────────
        location = /health {
            proxy_pass http://ticket-service:8001/health;
        }

        # ─── Ticket Service ────────────────────────────────────────────
        # GET /api/v1/tickets  (không trailing slash)
        location = /api/v1/tickets {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/v1/tickets/* (detail, comments, attachments, history)
        location /api/v1/tickets/ {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/api/v1/tickets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/v1/tickets/stats/summary (exact, không trailing slash)
        location /api/v1/tickets/stats/summary {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets/stats/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/v1/tickets/overdue
        location = /api/v1/tickets/overdue {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets/overdue;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── User Service ───────────────────────────────────────────────
        location /api/v1/users {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Notification Service ─────────────────────────────────────
        location /api/v1/notifications {
            set $ns notification-service;
            proxy_pass http://$ns:8003/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── AI Service ───────────────────────────────────────────────
        location /api/v1/classify {
            set $as ai-service;
            proxy_pass http://$as:8002/classify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/recommend {
            set $as ai-service;
            proxy_pass http://$as:8002/recommend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/solution {
            set $as ai-service;
            proxy_pass http://$as:8002/solution;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/duplicate {
            set $as ai-service;
            proxy_pass http://$as:8002/duplicate;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/summary {
            set $as ai-service;
            proxy_pass http://$as:8002/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/ai/health {
            set $as ai-service;
            proxy_pass http://$as:8002/health;
        }
    }
}
